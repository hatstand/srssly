[package]
name = "srssly-keys"
version = "0.1.0"
edition = "2024"
description = "Key management for Srssly end-to-end encrypted sync: passkey PRF wrapping, recovery keys, rotation"
publish = false

[dependencies]
base64 = "0.23.1"
bip39 = "3.0.0"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
hpke = { version = "0.15.2", default-features = false, features = ["aes", "alloc", "getrandom", "x25519"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.2"
thiserror = "2.0.21"
zeroize = { version = "1.9.2", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"
