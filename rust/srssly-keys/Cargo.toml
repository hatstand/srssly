[package]
name = "srssly-keys"
version = "0.1.0"
edition = "2024"
description = "Key management for Srssly end-to-end encrypted sync: passkey PRF wrapping, recovery keys, rotation"
publish = false

[dependencies]
base64 = "0.23.1"
bip39 = { version = "3.0.0", features = ["zeroize"] }
clap = { version = "4.6.10", features = ["derive"], optional = true }
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
hpke = { version = "0.15.2", default-features = false, features = ["aes", "alloc", "getrandom", "x25519"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
thiserror = "2.0.21"
zeroize = { version = "1.9.2", features = ["derive"] }

[features]
# Nothing by default, so a dependency (the app's FFI crate) or a workspace
# build can't pull in the CLI, SoftPasskey or secret export by accident.
default = []
# The command-line tool for manual and automated key-management testing.
cli = ["dep:clap", "export-root-secret", "soft-passkey"]
# RootSecret::export and RecoveryKey::words, for code that must store or show
# the raw secret (keychain, recovery key screen, CLI).
export-root-secret = []
# SoftPasskey, a software passkey for tests and the CLI. Never enable it in an app.
soft-passkey = []

[[bin]]
name = "srssly-keys"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[dev-dependencies]
tempfile = "3.27.0"
