name: Rust

on:
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  push:
    branches: [main]
    paths: ["rust/**", ".github/workflows/rust.yml"]

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-features --locked
      - run: cargo test --locked
      - name: Check the app library has no test-only code
        run: |
          cargo build --locked --release -p srssly-keys-ffi --lib
          if nm -C target/release/libsrssly_keys_ffi.a 2>/dev/null | grep -E 'SoftPasskey|RootSecret::export|PrfOutput::export|RecoveryKey::words'; then
            echo "libsrssly_keys_ffi.a contains test-only or secret-export code" >&2
            exit 1
          fi
      - name: Generate the Swift bindings
        run: |
          cargo build --locked -p srssly-keys-ffi --lib
          cargo run --locked -p uniffi-bindgen -- generate --library target/debug/libsrssly_keys_ffi.a --language swift --out-dir target/swift
          grep -q "public func formatVersion" target/swift/SrsslyKeys.swift
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check test vectors against the Python reference
        run: |
          pip install cryptography
          python srssly-keys/scripts/known_answers.py
