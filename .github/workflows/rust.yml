name: Rust

on:
  pull_request:
    paths: ["rust/**", "rust-toolchain.toml", ".github/workflows/rust.yml"]
  push:
    branches: [main]
    paths: ["rust/**", "rust-toolchain.toml", ".github/workflows/rust.yml"]

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-features --locked
      - run: cargo test --locked
      - name: Check the app library has no test-only code
        run: |
          # The guard: the FFI crate must enable none of srssly-keys' features.
          features=$(cargo tree --locked -p srssly-keys-ffi -e features -i srssly-keys)
          if grep -E 'srssly-keys feature "(cli|soft-passkey|export-root-secret)"' <<<"$features"; then
            echo "srssly-keys-ffi enables a test-only srssly-keys feature" >&2
            exit 1
          fi
          cargo build --locked --release -p srssly-keys-ffi --lib
          ../scripts/check-app-lib.sh target/release/libsrssly_keys_ffi.a
          # The symbol check must catch the code it looks for.
          cargo build --locked --release -p srssly-keys --lib --features cli
          if ../scripts/check-app-lib.sh target/release/libsrssly_keys.rlib >/dev/null 2>&1; then
            echo "check-app-lib.sh missed SoftPasskey in a cli build" >&2
            exit 1
          fi
      - name: Generate the Swift bindings
        run: |
          cargo build --locked -p srssly-keys-ffi --lib
          cargo run --locked -p uniffi-bindgen -- generate --library target/debug/libsrssly_keys_ffi.a --language swift --out-dir target/swift
          grep -q "public func formatVersion" target/swift/SrsslyKeys.swift
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check test vectors against the Python reference
        run: |
          pip install cryptography==50.0.1
          python srssly-keys/scripts/known_answers.py
