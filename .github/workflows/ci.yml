name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: SrsslyCore tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/SrsslyCore

  app:
    name: App build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      # XcodeGen rewrites the entitlements; without iCloud the app crashes at launch.
      - name: Check entitlements survived generation
        run: git diff --exit-code App/Srssly.entitlements && grep -q iCloud.com.purplehatstands.srssly App/Srssly.entitlements
      - name: Check privacy manifest is bundled
        run: grep -q "PrivacyInfo.xcprivacy in Resources" Srssly.xcodeproj/project.pbxproj
      - run: ./scripts/xcodebuild.sh test
